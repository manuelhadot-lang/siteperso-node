<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vue geo IGN — Giro3D</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="view"></div>
  <aside class="geo-panel" id="panel">
    <a class="geo-panel__back" href="/3D/">← Lab 3D</a>
    <h1>Vue geo IGN</h1>
    <p class="geo-panel__hint">Relief IGN + ortho + bâtiments 3D. La vue démarre en biais : de haut, le relief paraît plat.</p>
    <label>
      Latitude
      <input id="lat" type="number" step="0.00001" />
    </label>
    <label>
      Longitude
      <input id="lon" type="number" step="0.00001" />
    </label>
    <label>
      Zone (m)
      <input id="size" type="number" min="200" max="5000" step="50" />
    </label>
    <button type="button" id="btn-go" class="geo-panel__btn">Charger la zone</button>
    <hr class="geo-panel__sep" />
    <label>
      Date
      <input id="date" type="date" />
    </label>
    <label>
      Heure <output id="hour-out" class="geo-panel__out"></output>
      <input id="hour" type="range" min="0" max="23.75" step="0.25" />
    </label>
    <p id="sun-info" class="geo-panel__sun"></p>
    <p id="status" class="geo-panel__status">Initialisation…</p>
    <p class="geo-panel__attr">© IGN — RGE ALTI®, Ortho, BD TOPO® · moteur Giro3D</p>
  </aside>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
