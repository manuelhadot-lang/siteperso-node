<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Designer Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="menu-item">
            📁 Fichier
            <div class="dropdown">
                <button onclick="fileAction('open')">📂 Ouvrir</button>
                <button onclick="fileAction('save')">💾 Enregistrer</button>
                <button onclick="fileAction('saveas')">📝 Enregistrer sous</button>
                <div class="divider"></div>
                <button onclick="window.location.reload()" class="danger">❌ Quitter</button>
            </div>
        </div>

        <div class="menu-item">
            🧩 Composants
            <div class="dropdown">
                <button onclick="setTool('resistor')">⚡ Résistance</button>
                <button onclick="setTool('capacitor')">🌌 Condensateur</button>
            </div>
        </div>

        <div class="menu-item">
            🔋 Sources
            <div class="dropdown">
                <button onclick="setTool('vsource')">🔌 Alimentation DC</button>
            </div>
        </div>

        <div class="menu-item">
            📏 Appareils
            <div class="dropdown">
                <button onclick="setTool('voltmeter')">📟 Voltmètre</button>
            </div>
        </div>

        <div class="menu-item">
            ❓ Aide
            <div class="dropdown">
                <button onclick="showHelp()">⌨️ Commandes</button>
            </div>
        </div>

        <button id="runBtn">🚀 Lancer la Simulation</button>
    </header>

    <main id="editor-container">
        <canvas id="schematicCanvas"></canvas>
        <div id="ui-info">
            <span id="tool-name">Outil : Sélection</span> | 
            <span id="coords">X: 0, Y: 0</span>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
