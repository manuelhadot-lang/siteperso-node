<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grille Interactive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <nav class="menu-bar" aria-label="Menu principal">
            <div class="menu-group">
                <button class="menu-title" type="button">
                    <span class="menu-title-content">
                        <svg class="menu-icon menu-icon--file" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 3h7l5 5v13H7z"></path>
                            <path d="M14 3v5h5"></path>
                        </svg>
                        <span>Fichier</span>
                    </span>
                </button>
                <div class="menu-dropdown">
                    <button type="button" class="menu-item" data-action="new">Nouveau</button>
                    <button type="button" class="menu-item" data-action="open">Ouvrir</button>
                    <button type="button" class="menu-item" data-action="save">Enregistrer</button>
                    <button type="button" class="menu-item" data-action="saveAs">Enregistrer sous</button>
                </div>
            </div>

            <div class="menu-group">
                <button class="menu-title" type="button">
                    <span class="menu-title-content">
                        <svg class="menu-icon menu-icon--help" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M9.7 9.5a2.3 2.3 0 0 1 4.2 1.2c0 1.6-1.9 2-1.9 3.3"></path>
                            <circle cx="12" cy="16.8" r="0.8"></circle>
                        </svg>
                        <span>Aide</span>
                    </span>
                </button>
                <div class="menu-dropdown">
                    <button type="button" class="menu-item" data-action="about">A propos de</button>
                </div>
            </div>

            <div class="menu-group">
                <button class="menu-title" type="button">
                    <span class="menu-title-content">
                        <svg class="menu-icon menu-icon--theme" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"></path>
                        </svg>
                        <span>Theme</span>
                    </span>
                </button>
                <div class="menu-dropdown">
                    <button type="button" class="menu-item" data-action="themeDark">Dark</button>
                    <button type="button" class="menu-item" data-action="themeWhite">White</button>
                </div>
            </div>

            <div class="menu-group">
                <button class="menu-title" type="button">
                    <span class="menu-title-content">
                        <svg class="menu-icon menu-icon--sources" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 5v7"></path>
                            <path d="M7 14h10"></path>
                            <path d="M9 17h6"></path>
                            <path d="M10.5 20h3"></path>
                        </svg>
                        <span>Sources</span>
                    </span>
                </button>
                <div class="menu-dropdown">
                    <div class="menu-item" role="button" tabindex="0" data-action="sourceGround">Masse</div>
                    <div class="menu-item menu-submenu-parent" role="button" tabindex="0">
                        <span>Power</span>
                        <div class="menu-submenu" role="menu">
                            <div class="menu-item" role="menuitem" tabindex="0" data-action="sourceSupply">Alimentation</div>
                            <div class="menu-item" role="menuitem" tabindex="0" data-action="sourcePowerTerminal">Borne</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="menu-group">
                <button class="menu-title" type="button">
                    <span class="menu-title-content">
                        <svg class="menu-icon menu-icon--components" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="4" width="6" height="6"></rect>
                            <rect x="14" y="4" width="6" height="6"></rect>
                            <rect x="4" y="14" width="6" height="6"></rect>
                            <rect x="14" y="14" width="6" height="6"></rect>
                        </svg>
                        <span>Composants</span>
                    </span>
                </button>
                <div class="menu-dropdown">
                    <div class="menu-item" role="button" tabindex="0" data-action="componentResistance">Resistance</div>
                    <div class="menu-item" role="button" tabindex="0" data-action="componentCapacitor">Condensateur</div>
                    <div class="menu-item" role="button" tabindex="0" data-action="componentDiode">Diode</div>
                    <div class="menu-item" role="button" tabindex="0" data-action="componentInductor">Bobine</div>
                    <div class="menu-item menu-submenu-parent" role="button" tabindex="0">
                        <span>Transistor</span>
                        <div class="menu-submenu" role="menu">
                            <div class="menu-item" role="menuitem" tabindex="0" data-action="componentTransistorNpn">NPN</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="menu-group">
                <button class="menu-title" type="button">
                    <span class="menu-title-content">
                        <svg class="menu-icon menu-icon--devices" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="6" y="4" width="12" height="14" rx="2"></rect>
                            <path d="M9 9h6M9 12h6M9 15h4"></path>
                            <circle cx="12" cy="20" r="1.2" class="menu-icon-fill"></circle>
                        </svg>
                        <span>Appareils</span>
                    </span>
                </button>
                <div class="menu-dropdown">
                    <div class="menu-item" role="button" tabindex="0" data-action="deviceVoltmeter">Voltmètre</div>
                    <div class="menu-item" role="button" tabindex="0" data-action="deviceAmmeter">Ampèrmètre</div>
                    <div class="menu-item" role="button" tabindex="0" data-action="deviceOhmmeter">Ohmmètre</div>
                </div>
            </div>

            <div class="menu-spacer"></div>

            <button class="menu-title" type="button" data-action="simulateNgspice" aria-label="Simuler avec ngspice">
                <span class="menu-title-content">
                    <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M8 6l10 6-10 6z"></path>
                    </svg>
                    <span>Simuler</span>
                </span>
            </button>

            <button class="menu-title menu-title-wire" type="button" data-action="componentWire" aria-label="Fil">
                <span class="menu-title-content">
                    <svg class="menu-icon menu-icon--wire" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="5" cy="12" r="2"></circle>
                        <circle cx="19" cy="12" r="2"></circle>
                        <path d="M7 12h4c2 0 2-4 4-4h2"></path>
                    </svg>
                    <span>Fil</span>
                </span>
            </button>
        </nav>
    </header>

    <main class="app-area">
        <canvas id="gridCanvas"></canvas>
    </main>
    <dialog id="newProjectDialog" class="app-dialog">
        <form method="dialog" class="dialog-content">
            <h3>Nouveau schema</h3>
            <p>Voulez-vous enregistrer sous avant de creer un nouveau schema ?</p>
            <div class="dialog-actions">
                <button type="button" class="dialog-button" data-choice="yes">Oui</button>
                <button type="button" class="dialog-button" data-choice="no">Non</button>
                <button type="button" class="dialog-button dialog-cancel" data-choice="cancel">Annuler</button>
            </div>
        </form>
    </dialog>
    <input type="file" id="openProjectInput" accept=".json,application/json" hidden>
    <script type="module" src="main.js"></script>
</body>
</html>
