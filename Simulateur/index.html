<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Circuit Designer Pro - Graphique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <input type="file" id="file-open-input" accept=".json,application/json" hidden>

        <div class="menu-item">
            📁 Fichier
            <div class="dropdown">
                <button type="button" onclick="nouveauDocument()">📄 Nouveau</button>
                <button type="button" onclick="openCircuit()">📂 Ouvrir…</button>
                <button type="button" onclick="save()">💾 Enregistrer</button>
                <button type="button" onclick="saveAs()">💾 Enregistrer sous…</button>
                <button type="button" onclick="window.close()" style="border-top: 1px solid #444; color: #ff5555;">❌ Quitter</button>
            </div>
        </div>

        <div class="menu-item">
            🧩 Composants
            <div class="dropdown">
                <button draggable="true" 
                        onmousedown="event.stopPropagation()" 
                        ondragstart="handleDragStart(event, 'resistor')">⚡ Résistance</button>
            </div>
        </div>

        <div class="menu-item">
            🔋 Sources
            <div class="dropdown">
                <button draggable="true" 
                        onmousedown="event.stopPropagation()" 
                        ondragstart="handleDragStart(event, 'vsource')">🔌 Pile DC (5V)</button>
            </div>
        </div>

        <div class="menu-item">
            📏 Appareils
            <div class="dropdown">
                <button draggable="true" 
                        onmousedown="event.stopPropagation()" 
                        ondragstart="handleDragStart(event, 'voltmeter')">📟 Voltmètre</button>
            </div>
        </div>

        <button id="runBtn">🚀 Lancer la Simulation</button>
    </header>

    <main id="editor-container">
        <canvas id="schematicCanvas"></canvas>
        <div id="ui-info">
            <span id="tool-info">R : Rotation | Ctrl+C / Ctrl+V | Clic Gauche : Déplacer | Clic Droit : Vue</span> | 
            <span id="coords">X: 0, Y: 0</span>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
