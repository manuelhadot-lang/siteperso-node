<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur de Circuits Electroniques</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="menu-item">
            <span class="menu-icon">📁</span> Fichier
            <div class="dropdown">
                <div class="dropdown-item" id="btn-new">📄 Nouveau</div>
                <div class="dropdown-item" id="btn-open">📂 Ouvrir...</div>
                <div class="dropdown-item" id="btn-save">💾 Enregistrer</div>
                <div class="dropdown-item" id="btn-save-as">💾 Enregistrer sous...</div>
            </div>
        </div>
        <div class="menu-item">
            <span class="menu-icon">⚡</span> Sources
            <div class="dropdown">
                <div class="dropdown-item" draggable="true" data-component="battery">🔋 Pile 5V</div>
            </div>
        </div>
        <div class="menu-item">
            <span class="menu-icon">🔌</span> Composants
            <div class="dropdown">
                <div class="dropdown-item" draggable="true" data-component="resistor">⚡ Résistance</div>
            </div>
        </div>
        <div class="menu-item">
            <span class="menu-icon">🧠</span> Logique
            <div class="dropdown">
                <div class="dropdown-item" draggable="true" data-component="nand">👾 Porte NAND</div>
            </div>
        </div>
        <div class="menu-item">
            <span class="menu-icon">📊</span> Instruments
            <div class="dropdown">
                <div class="dropdown-item" draggable="true" data-component="voltmeter">🩺 Voltmètre</div>
            </div>
        </div>

        <button id="btn-simulate">🚀 Lancer Simulation</button>

        <div class="info-space">⌨️ [Shift] + Cadre pour sélectionner | [R] Rotation | [Suppr] Effacer</div>
    </header>

    <main class="canvas-container">
        <canvas id="circuitCanvas"></canvas>
    </main>

    <script src="app.js"></script>
</body>
</html>
