<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Évaluation SIN | Saint Erembert</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background:#0f172a; color:white; font-family:sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
        .quiz-card { background:#1e293b; padding:30px; border-radius:15px; border:2px solid #00d1ff; width:90%; max-width:600px; box-shadow: 0 0 20px rgba(0,209,255,0.1); }
        .btn-ans { display:block; width:100%; padding:15px; margin:10px 0; background:#334155; color:white; border:1px solid #475569; border-radius:8px; cursor:pointer; text-align:left; transition:0.2s; }
        .btn-ans:hover { background:#475569; border-color:#00d1ff; }
        .progress { height:5px; background:#334155; margin-bottom:20px; border-radius:2px; }
        .progress-bar { height:100%; background:#00d1ff; width:0%; transition:0.3s; }
    </style>
</head>
<body>

<!-- Liste de sélection si pas de quiz choisi -->
<div id="selection-screen" class="quiz-card" style="text-align:center; display:none;">
    <h2 style="font-family:'Orbitron'; color:#00d1ff;">CHOISIR UNE ÉVALUATION</h2>
    <div id="available-quizzes" style="display:flex; flex-direction:column; gap:10px; margin-top:20px;">
        <!-- Liste générée -->
    </div>
</div>

<div class="quiz-card" id="main-container">
    <div id="auth-box" style="text-align:center;">
        <h2 style="font-family:'Orbitron'; color:#00d1ff;" id="quiz-title-display">ACCÈS ÉVALUATION</h2>
        <p>Identifiez-vous avec votre code élève :</p>
        <input type="text" id="student-code" placeholder="CODE (ex: JD123)" style="width:80%; padding:12px; margin:20px 0; border-radius:5px; border:none; text-align:center; font-size:1.2rem; text-transform:uppercase;">
        <button onclick="startQuiz()" style="width:85%; padding:12px; background:#00d1ff; color:#0f172a; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">VALIDER ET COMMENCER</button>
        <p id="error-msg" style="color:#f87171; margin-top:15px; display:none;">❌ Code inconnu dans la base.</p>
    </div>

    <div id="quiz-zone" style="display:none;">
        <div class="progress"><div id="p-bar" class="progress-bar"></div></div>
        <div id="q-content" style="margin-bottom:20px;"></div>
        <div id="answers-zone"></div>
    </div>

    <div id="result-zone" style="display:none; text-align:center;">
        <h2 id="final-score" style="font-size:3rem; color:#00d1ff; margin:0;">0/20</h2>
        <p id="save-status" style="color:#10b981; font-weight:bold; margin-top:10px;">Envoi de la note...</p>
        <button onclick="window.location.href='/'" style="margin-top:20px; padding:10px 20px; background:none; border:1px solid #00d1ff; color:#00d1ff; cursor:pointer; border-radius:5px;">Retour à l'accueil</button>
    </div>
</div>

<script>
// CONFIGURATION DU QUIZ
let questions = [];
let quizId = null;
let quizTitle = "Évaluation";

let currentIdx = 0;
let score = 0;
let studentInfo = null;

// INIT : Vérifie si un ID est passé ou charge la liste
async function init() {
    const urlParams = new URLSearchParams(window.location.search);
    quizId = urlParams.get('id');

    if (!quizId) {
        // Mode sélection
        document.getElementById('main-container').style.display = 'none';
        document.getElementById('selection-screen').style.display = 'block';
        try {
            const res = await fetch('/api/list-quizzes');
            const list = await res.json();
            const container = document.getElementById('available-quizzes');
            if(list.length === 0) container.innerHTML = "<p>Aucun quiz disponible.</p>";
            list.forEach(q => {
                container.innerHTML += `<button class="btn-ans" onclick="window.location.search='?id=${q.id}'">${q.title} (${q.count} questions)</button>`;
            });
        } catch(e) { console.error(e); }
    } else {
        // Mode Lecteur : Charge le quiz
        try {
            const res = await fetch('/api/get-quiz/' + quizId);
            if(!res.ok) return alert("Quiz introuvable");
            const data = await res.json();
            questions = data.questions;
            quizTitle = data.title;
            document.getElementById('quiz-title-display').innerText = quizTitle.toUpperCase();
        } catch(e) { alert("Erreur chargement quiz"); }
    }
}
init();

async function startQuiz() {
    const code = document.getElementById('student-code').value.trim().toUpperCase();
    if(!code) return;

    try {
        const res = await fetch('/api/check-student/' + code);
        const data = await res.json();
        
        if (data.exists) {
            studentInfo = { code: code, nom: data.nom, prenom: data.prenom };
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('quiz-zone').style.display = 'block';
            showQuestion();
        } else {
            document.getElementById('error-msg').style.display = 'block';
        }
    } catch(e) { alert("Erreur serveur"); }
}

function showQuestion() {
    const q = questions[currentIdx];
    
    // Affichage texte + image si présente
    let html = `<h3>${currentIdx + 1}. ${q.text}</h3>`;
    if(q.image) html += `<img src="${q.image}" style="max-width:100%; max-height:200px; border-radius:8px; margin:10px 0; border:1px solid #444;">`;
    document.getElementById('q-content').innerHTML = html;

    document.getElementById('p-bar').style.width = ((currentIdx / questions.length) * 100) + "%";
    
    const zone = document.getElementById('answers-zone');
    zone.innerHTML = "";
    
    q.answers.forEach((ans, i) => {
        const b = document.createElement('button');
        b.className = "btn-ans";
        b.innerText = ans;
        b.onclick = () => next(i);
        zone.appendChild(b);
    });
}

function next(choice) {
    if(choice == questions[currentIdx].correct) score++; // '==' car parfois string/int
    currentIdx++;

    if(currentIdx < questions.length) {
        showQuestion();
    } else {
        finish();
    }
}

async function finish() {
    document.getElementById('quiz-zone').style.display = 'none';
    document.getElementById('result-zone').style.display = 'block';
    
    const noteSur20 = Math.round((score / questions.length) * 20);
    document.getElementById('final-score').innerText = noteSur20 + "/20";

    // ENVOI AUTOMATIQUE AU SERVEUR
    try {
        const res = await fetch('/api/save-note', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                codeEleve: studentInfo.code,
                quizNom: quizTitle, // Nom dynamique
                note: noteSur20
            })
        });
        const data = await res.json();
        if(data.success) document.getElementById('save-status').innerText = "✅ Note enregistrée pour " + studentInfo.prenom;
        else document.getElementById('save-status').innerText = "⚠️ Erreur d'enregistrement.";
    } catch(e) { document.getElementById('save-status').innerText = "❌ Connexion perdue."; }
}
</script>
    <script src="/site-access-unload.js" defer></script>

</body>
</html>
