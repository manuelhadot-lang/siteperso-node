<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dépôt de TP | STI2D</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body 
        { 
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            background-image: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)),url("photo_classe.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed; /* L'image reste fixe quand on scrolle, effet très moderne */
            background-position: center;
            display: flex; justify-content: center; 
            align-items: center; 
            min-height: 100vh; margin: 0; 
        }
        
        .upload-container 
        { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%; max-width: 500px; 
        }

        h1 
        { 
            font-size: 1.5rem; 
            margin-bottom: 25px; color: #00d1ff; 
            border-bottom: 2px solid #f0f2f5; 
            padding-bottom: 10px; 
        }
        
        .form-group 
        {
             margin-bottom: 20px; 
        }

        label 
        { 
            display: block; 
            font-size: 0.85rem; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: #6c757d; 
        }

        input, select 
        { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #eaeaea; 
            border-radius: 6px; 
            font-family: inherit; 
            font-size: 0.9rem; 
            box-sizing: border-box; 
        }

        input:focus 
        { 
            outline: none; 
            border-color: #00d1ff; 
            background: #f0faff; 
        }
        
        .file-input-wrapper
        { 
            border: 2px dashed #eaeaea; 
            padding: 20px; 
            text-align: center; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: 0.3s; 
        }

        .file-input-wrapper:hover 
        { 
            border-color: #00d1ff; 
            background: #f0faff; 
        }
        
        button 
        { 
            width: 100%; 
            padding: 15px; 
            background: #00d1ff; 
            border: none; 
            border-radius: 6px; 
            color: white; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: 0.3s; 
        }

        button:hover 
        { 
            background: #00b8e6; 
            transform: translateY(-2px); 
        }

        .back-link 
        { 
            display: block; 
            text-align: center; 
            margin-top: 20px; 
            font-size: 0.8rem; 
            color: #6c757d; 
            text-decoration: none; 
        }
    </style>
</head>
<body>

<div class="upload-container">
    <h1>📤 Dépôt de Compte-Rendu</h1>
    <form action="/upload-tp" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>CODE D'ACCÈS (Donné en classe)</label>
            <input type="password" name="access_code" placeholder="Saisir le code ici" required autocomplete="off">
        </div>
        <div class="form-group">
            <label>NOM</label>
            <input type="text" name="nom" placeholder="Ex: DUPONT" required>
        </div>
        <div class="form-group">
            <label>PRÉNOM</label>
            <input type="text" name="prenom" placeholder="Ex: Jean" required>
        </div>
        <div class="form-group">
                <label>PROJET CONCERNÉ</label>
                <select name="projet" required>
                <option value="">Sélectionnez le projet</option>
                <option value="Robotique">Robotique</option>
                <option value="UltraSon">UltraSon</option>
                <option value="Station_Meteo">Station Météo</option>
                <option value="Digicode">Digicode</option>
                <option value="Robo_Cytron_ESP32">Robo Cytron ESP32</option>
            </select>
        </div>
        <div class="form-group">
            <label>CLASSE</label>
            <select name="classe" required>
                <option value="">Sélectionnez votre classe</option>
                <option value="1STI2D1">1ère STI2D 1</option>
                <option value="1STI2D2">1ère STI2D 2</option>
                <option value="TSTI2D1">Terminale STI2D 1</option>
                <option value="TSTI2D2">Terminale STI2D 2</option>
            </select>
        </div>
        <div class="form-group">
            <label>FICHIER (PDF, ZIP...)</label>
            <div class="file-input-wrapper">
                <input type="file" name="tp_file" required>
            </div>
        </div>
        <button type="submit">ENVOYER LE TRAVAIL</button>
        <a href="/" class="back-link">← Retour au portail</a>
    </form>
</div>

    <script src="/site-access-unload.js" defer></script>
</body>
</html>
